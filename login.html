<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECYCLA'P - Iniciar Sesión</title>
    <meta name="description" content="Inicia sesión en RECYCLA'P para ganar puntos reciclando">
    <link rel="stylesheet" href="auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="auth-screen">
        <div class="auth-container">
            <div class="auth-header">
                <div class="logo-container">
                    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 6h18l-1.68 11.76a2 2 0 0 1-2 1.74H6.68a2 2 0 0 1-2-1.74L3 6z" />
                        <path d="M16 10a4 4 0 0 1-8 0" />
                        <circle cx="12" cy="8" r="3" fill="currentColor" />
                    </svg>
                    <h1 class="logo-text">RECYCLA'P</h1>
                </div>
                <p class="auth-subtitle">Recicla inteligentemente, gana recompensas</p>
            </div>

            <!-- Login Form -->
            <div id="login-form" class="auth-form active">
                <h2 class="form-title">Iniciar Sesión</h2>
                <form onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <label for="login-email">Correo Electrónico</label>
                        <input type="email" id="login-email" required placeholder="tu@email.com">
                    </div>
                    <div class="input-group">
                        <label for="login-password">Contraseña</label>
                        <input type="password" id="login-password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
                </form>
                <p class="form-switch">
                    ¿No tienes cuenta?
                    <a href="#" onclick="switchToRegister(event)">Regístrate aquí</a>
                </p>
            </div>

            <!-- Register Form -->
            <div id="register-form" class="auth-form">
                <h2 class="form-title">Crear Cuenta</h2>
                <form onsubmit="handleRegister(event)">
                    <div class="input-group">
                        <label for="register-name">Nombre Completo</label>
                        <input type="text" id="register-name" required placeholder="Juan Pérez">
                    </div>
                    <div class="input-group">
                        <label for="register-email">Correo Electrónico</label>
                        <input type="email" id="register-email" required placeholder="tu@email.com">
                    </div>
                    <div class="input-group">
                        <label for="register-password">Contraseña</label>
                        <input type="password" id="register-password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-primary">Crear Cuenta</button>
                </form>
                <p class="form-switch">
                    ¿Ya tienes cuenta?
                    <a href="#" onclick="switchToLogin(event)">Inicia sesión aquí</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="auth.js"></script>
</body>

</html>
